```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapher Key System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("https://media.istockphoto.com/id/2187213676/photo/black-dark-navy-cobalt-blue-white-abstract-background-color-gradient-ombre-noise-grain-mesh.jpg?s=612x612&w=0&k=20&c=i7MIbbQh6EUx2ghIKZhmbyWzYexs6AfTcKrqERMbTSU=") center center/cover no-repeat;
    overflow:hidden;
}

.overlay{
    position:absolute;
    inset:0;
    backdrop-filter:blur(15px);
    background:rgba(0,0,0,0.35);
}

.card{
    position:relative;
    width:420px;
    padding:30px;
    border-radius:24px;

    background:rgba(20,35,60,0.45);
    backdrop-filter:blur(30px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
    0 8px 32px rgba(0,0,0,.4),
    0 0 30px rgba(80,120,255,.15);

    color:white;
    z-index:2;
}

.mac-buttons{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:999px;
}

.red{background:#ff5f57;}
.yellow{background:#febc2e;}
.green{background:#28c840;}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    opacity:.7;
    margin-bottom:25px;
}

.key-box{
    width:100%;
    min-height:55px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    word-break:break-all;
}

.button{
    width:100%;
    border:none;
    cursor:pointer;
    border-radius:14px;
    padding:14px;
    margin-top:12px;
    font-size:15px;
    color:white;
    transition:.2s;
}

.button:hover{
    transform:translateY(-2px);
}

.generate{
    background:linear-gradient(
        135deg,
        rgb(40,90,255),
        rgb(80,130,255)
    );
}

.copy{
    background:rgba(255,255,255,.08);
}

.countdown{
    margin-top:18px;
    text-align:center;
    font-size:14px;
    opacity:.85;
}

.status{
    text-align:center;
    margin-top:10px;
    color:#9dc1ff;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">

    <div class="mac-buttons">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
    </div>

    <h1>🔑 Tapher Keys</h1>
    <div class="subtitle">
        Secure Authentication System
    </div>

    <div id="keyBox" class="key-box">
        No key generated
    </div>

    <button class="button generate" onclick="generateKey()">
        Generate Key
    </button>

    <button class="button copy" onclick="copyKey()">
        Copy Key
    </button>

    <div id="countdown" class="countdown">
        Generate a key first
    </div>

    <div id="status" class="status"></div>

</div>

<script>

const API =
"https://key-api.dzaxtheonly1.workers.dev/generate"

let currentKey = ""
let expiryDate = null

async function generateKey(){

    const status =
    document.getElementById("status")

    try{

        status.textContent = "Generating..."

        const res = await fetch(API)
        const data = await res.json()

        currentKey =
        data[0].license_key

        expiryDate =
        new Date(data[0].expires_at)

        document.getElementById("keyBox")
        .textContent = currentKey

        status.textContent =
        "Key generated successfully"

        updateCountdown()

    }catch(err){

        console.error(err)

        status.textContent =
        "Failed to generate key"

    }
}

function copyKey(){

    if(!currentKey) return

    navigator.clipboard
    .writeText(currentKey)

    document.getElementById("status")
    .textContent = "Copied to clipboard"
}

function updateCountdown(){

    if(!expiryDate) return

    const countdown =
    document.getElementById("countdown")

    const interval = setInterval(()=>{

        const now = new Date()
        const diff = expiryDate - now

        if(diff <= 0){

            countdown.textContent =
            "Expired"

            clearInterval(interval)
            return
        }

        const hours =
        Math.floor(diff/1000/60/60)

        const mins =
        Math.floor(
            (diff%(1000*60*60))
            /(1000*60)
        )

        const secs =
        Math.floor(
            (diff%(1000*60))/1000
        )

        countdown.textContent =
        `Expires in ${hours}h ${mins}m ${secs}s`

    },1000)
}
</script>

</body>
</html>
```
